[project]
name = "payment-communities"
version = "0.2.0"
description = "Bitcoin Micropayment Channels (Payment Communities) simulation for Bitcoin Testnet/Signet"
authors = [
    { name = "Seintian", email = "seintian@altervista.org" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-bitcoinlib>=0.12.2",
    "python-dotenv>=1.2.3",
    "typer>=0.27.1",
]

[project.scripts]
payment-communities = "payment_communities.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]

